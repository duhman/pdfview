name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  lint:
    name: Code Quality
    uses: ./.github/workflows/quality.yml

  release:
    name: Build and attach app bundle
    needs: lint
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build debug app (stock Bash)
        run: /bin/bash ./build_app.sh debug

      - name: Test
        run: swift test --parallel

      - name: Build universal app bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCHES: arm64 x86_64
        run: /bin/bash ./build_app.sh release

      - name: Verify app bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test -x PDFView.app/Contents/MacOS/PDFView
          test -s PDFView.app/Contents/Resources/AppIcon.icns
          lipo -verify_arch arm64 PDFView.app/Contents/MacOS/PDFView
          lipo -verify_arch x86_64 PDFView.app/Contents/MacOS/PDFView
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' PDFView.app/Contents/Info.plist)" = AppIcon
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' PDFView.app/Contents/Info.plist)" = 14.2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' PDFView.app/Contents/Info.plist)" = "$VERSION"
          codesign --verify --strict PDFView.app

      - name: Zip app bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ditto -c -k --keepParent PDFView.app "PDFView-${VERSION}-universal.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Universal macOS build (Apple silicon and Intel, macOS 14.2 or later).

          Unzip the download and move PDFView.app to Applications. This build is ad-hoc signed and not notarized.

          - macOS 14: right-click PDFView.app in Finder, choose Open, then confirm Open.
          - macOS 15 or later: try opening the app once and dismiss the alert. Open System Settings > Privacy & Security, choose Open Anyway for PDFView, authenticate if asked, and confirm Open. The right-click override is no longer available.

          See [CHANGELOG.md](https://github.com/duhman/pdfview/blob/main/CHANGELOG.md) for details.
          NOTES
          gh release create "v${VERSION}" \
            "PDFView-${VERSION}-universal.zip" \
            --title "PDFView ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
