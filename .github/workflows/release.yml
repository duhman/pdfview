name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  release:
    name: Build and attach app bundle
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test --parallel

      - name: Build universal app bundle
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          swift build -c release --arch arm64 --scratch-path .build-arm
          swift build -c release --arch x86_64 --scratch-path .build-x86
          ./build_app.sh release
          lipo -create \
            .build-arm/out/Products/Release/PDFView \
            .build-x86/out/Products/Release/PDFView \
            -output PDFView.app/Contents/MacOS/PDFView
          codesign --force --sign - --entitlements Resources/PDFView.entitlements PDFView.app

      - name: Verify app bundle
        run: |
          test -d PDFView.app/Contents
          test -x PDFView.app/Contents/MacOS/PDFView
          lipo -info PDFView.app/Contents/MacOS/PDFView | grep -q arm64
          lipo -info PDFView.app/Contents/MacOS/PDFView | grep -q x86_64
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' PDFView.app/Contents/Info.plist | grep -q '14.2'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' PDFView.app/Contents/Info.plist | grep -q "${{ steps.version.outputs.value }}"
          codesign --verify --strict PDFView.app

      - name: Zip app bundle
        run: ditto -c -k --keepParent PDFView.app "PDFView-${{ steps.version.outputs.value }}-universal.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v${VERSION}" \
            "PDFView-${VERSION}-universal.zip" \
            --title "PDFView ${VERSION}" \
            --notes "Universal macOS build (Apple silicon and Intel, macOS 14.2 or later). Ad-hoc signed, not notarized: on first launch, right-click PDFView.app, choose Open, then confirm. See CHANGELOG.md for details."
