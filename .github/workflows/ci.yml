name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build debug app (stock Bash)
        run: /bin/bash ./build_app.sh debug

      - name: Test
        run: swift test --parallel

      - name: Build release app (stock Bash)
        run: /bin/bash ./build_app.sh release

      - name: Verify app bundle
        run: |
          test -x PDFView.app/Contents/MacOS/PDFView
          test -s PDFView.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' PDFView.app/Contents/Info.plist)" = AppIcon
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' PDFView.app/Contents/Info.plist)" = 14.2
          codesign --verify --strict PDFView.app
          ditto -c -k --keepParent PDFView.app PDFView.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PDFView-${{ github.sha }}
          path: PDFView.zip
          retention-days: 14

  lint:
    name: Code Quality
    uses: ./.github/workflows/quality.yml

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate documentation and resources
        run: |
          grep -q "## Install" README.md
          grep -q "## Development" README.md
          grep -q "duhman/pdfview" README.md
          test -f Resources/PDFView.entitlements
          test -s Resources/AppIcon.icns
          test -f scripts/make-icon.swift
          test -f Tests/PDFViewAppTests/PDFViewerDocumentTests.swift
