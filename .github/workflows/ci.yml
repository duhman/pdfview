name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build (debug)
        run: swift build --configuration debug

      - name: Test
        run: swift test --parallel

      - name: Build (release)
        run: swift build --configuration release

      - name: Build app bundle
        run: ./build_app.sh release

      - name: Verify app bundle
        run: |
          test -d PDFView.app/Contents
          test -x PDFView.app/Contents/MacOS/PDFView
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' PDFView.app/Contents/Info.plist | grep -q '14.2'
          codesign --verify --strict PDFView.app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PDFView-${{ github.sha }}
          path: PDFView.app/
          retention-days: 14

  lint:
    name: Code Quality
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          curl -fsSL https://github.com/realm/SwiftLint/releases/latest/download/portable_swiftlint.zip -o swiftlint.zip
          unzip -q swiftlint.zip
          chmod +x swiftlint

      - name: Run SwiftLint
        run: ./swiftlint lint --reporter github-actions-logging

      - name: Install SwiftFormat
        run: |
          curl -fsSL https://github.com/nicklockwood/SwiftFormat/releases/latest/download/swiftformat.zip -o swiftformat.zip
          unzip -q swiftformat.zip
          chmod +x swiftformat

      - name: Check SwiftFormat
        run: ./swiftformat --lint .

  docs:
    name: Documentation sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README structure
        run: |
          grep -q "## Quick Start" README.md
          grep -q "## Development" README.md
          grep -q "duhman/pdfview" README.md
          test -f Resources/PDFView.entitlements
          test -f Tests/PDFViewAppTests/PDFViewerDocumentTests.swift
